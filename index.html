<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>穿搭鏡 · 試衣模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BFE8FB;
    --sky-bot:#E9F7ED;
    --grass:#BFE3A0;
    --card:#FFFBF1;
    --card-edge:#F0E4C8;
    --ink:#3A342A;
    --ink-soft:#8A8072;
    --leaf:#6FB43F;
    --leaf-deep:#4E8F29;
    --coral:#FF8B6B;
    --coral-deep:#E5623F;
    --sun:#FFCF4D;
    --sun-deep:#E5A924;
    --lav:#B9A6E0;
    --lav-deep:#9481C4;
    --sky-btn:#6FC2E8;
    --sky-btn-deep:#3E9BC7;
    --shadow: 0 8px 0 rgba(58,52,42,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; touch-action:manipulation; overscroll-behavior-y:none;}
  body{
    font-family:'Noto Sans TC','Baloo 2',sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bot) 55%, var(--grass) 100%);
    background-attachment:fixed;
    min-height:100vh;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:460px; margin:0 auto;
    padding:22px 16px 32px;
    position:relative; z-index:1;
    touch-action:manipulation;
  }

  /* header */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand .dot{ width:14px;height:14px;border-radius:50%;background:var(--sun); border:2px solid var(--ink); }
  .brand h1{ font-family:'Baloo 2'; font-size:19px; margin:0; letter-spacing:.3px; }
  .icon-btn{
    width:34px;height:34px;border-radius:12px;background:var(--card);
    border:2px solid var(--ink); display:flex;align-items:center;justify-content:center;
    font-size:16px; box-shadow:0 3px 0 rgba(58,52,42,0.25); cursor:pointer;
  }

  /* category dropdown */
  .type-select-wrap{ margin:6px 2px 12px; }
  .type-select-wrap label{ display:block; font-size:12px; font-weight:800; color:var(--ink-soft); margin-bottom:6px; }
  .select-shell{ position:relative; }
  .select-shell::after{
    content:"▾"; position:absolute; right:16px; top:50%; transform:translateY(-50%);
    font-weight:900; pointer-events:none; color:var(--ink); font-size:14px;
  }
  .type-select{
    width:100%; padding:12px 40px 12px 14px; border-radius:16px; border:2px solid var(--ink);
    background:var(--card); font-family:inherit; font-weight:800; font-size:15px; color:var(--ink);
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    box-shadow:0 3px 0 rgba(58,52,42,0.2); cursor:pointer;
  }

  /* preset quick-chip row */
  .presets-row{ display:flex; gap:8px; overflow-x:auto; padding:0 2px 14px; scrollbar-width:none; }
  .presets-row::-webkit-scrollbar{ display:none; }
  .preset-chip{
    flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:7px 13px; border-radius:999px;
    border:2px solid var(--ink); background:var(--card); font-size:12px; font-weight:800;
    white-space:nowrap; box-shadow:0 2px 0 rgba(58,52,42,0.2); cursor:pointer;
  }
  .preset-chip.add{ background:var(--sun); }
  .preset-chip .del-x{ margin-left:2px; color:var(--coral-deep); font-weight:900; }
  .presets-empty-hint{ font-size:11px; color:var(--ink-soft); padding:0 2px 12px; }

  /* stage */
  .stage{
    position:relative; height:280px; border-radius:26px; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 12%, #FFFDF6 0%, transparent 55%),
               linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 62%, var(--grass) 100%);
    border:2px solid var(--card-edge);
    margin-bottom:14px;
  }
  .cloud{ position:absolute; background:#fff; border-radius:50%; opacity:.85; }
  .figure{ position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); width:132px; image-rendering:pixelated; }
  .tag{
    position:absolute; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;
    border:2px solid var(--ink); background:var(--card); white-space:nowrap;
    box-shadow:0 2px 0 rgba(58,52,42,0.25);
    transition:background .25s, color .25s;
  }
  .stage-rotate{
    position:absolute; bottom:10px; right:10px; display:flex; gap:6px;
  }
  .stage-rotate .icon-btn{ width:30px;height:30px; font-size:13px; }
  .tri{ width:0; height:0; display:inline-block; }
  .tri-left{ border-top:6px solid transparent; border-bottom:6px solid transparent; border-right:9px solid var(--ink); }
  .tri-right{ border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:9px solid var(--ink); }
  .verdict-banner{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:18px;
    border:2px solid var(--ink); margin-bottom:14px; background:var(--card);
    box-shadow:var(--shadow);
  }
  .verdict-badge{
    flex:0 0 auto; padding:8px 6px; min-width:50px; text-align:center; border-radius:12px;
    border:2px solid var(--ink); font-weight:800; font-size:12px; line-height:1.3;
  }
  .verdict-banner .t1{ font-size:11px; color:var(--ink-soft); font-weight:700; }
  .verdict-banner .t2{ font-size:15px; font-weight:900; }

  /* sheet */
  .sheet{
    background:var(--card); border:2px solid var(--card-edge); border-radius:24px 24px 18px 18px;
    padding:6px 4px 16px; box-shadow:var(--shadow);
  }
  .tabs{ display:flex; padding:10px 8px 0; gap:4px; }
  .tab{
    flex:1; text-align:center; padding:9px 2px; font-weight:800; font-size:12px;
    border-radius:14px 14px 0 0; cursor:pointer; color:var(--ink-soft);
  }
  .tab.active{ background:#FFF; color:var(--ink); border:2px solid var(--card-edge); border-bottom:none; }
  .panel{ padding:14px 14px 4px; display:none; }
  .panel.active{ display:block; }

  .field{ margin-bottom:11px; }
  .field label{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .field label span.opt{ font-weight:500; color:#B7AF9F; }
  .field input[type=number], .field input[type=text]{
    width:100%; padding:9px 10px; border-radius:12px; border:2px solid var(--card-edge);
    font-size:16px; font-family:inherit; background:#FFFDF8; color:var(--ink); font-weight:700;
  }
  .field input[type=number]:focus, .field input[type=text]:focus{ outline:none; border-color:var(--sky-btn); }
  .field input[type=number]:disabled{ background:#EFEAE0; color:var(--ink-soft); border-color:#E4DCC9; cursor:not-allowed; }
  .field select.simple-select{
    width:100%;padding:9px;border-radius:12px;border:2px solid var(--card-edge);
    font-weight:700;font-family:inherit;font-size:14px;background:#FFFDF8;color:var(--ink);
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }

  .lock-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; margin-bottom:12px; border-radius:14px;
    background:#FFF6DC; border:2px solid var(--card-edge);
  }
  .lock-bar.is-locked{ background:#EAF6E4; border-color:var(--leaf); }
  .lock-label{ font-size:12.5px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .status-dot{ width:9px; height:9px; border-radius:2px; background:var(--sun-deep); display:inline-block; flex:0 0 auto; }
  .lock-bar.is-locked .status-dot{ background:var(--leaf-deep); }
  .lock-btn{
    padding:6px 12px; border-radius:999px; border:2px solid var(--ink); font-weight:800;
    font-size:12px; cursor:pointer; background:var(--card); box-shadow:0 2px 0 rgba(58,52,42,0.2);
  }
  .lock-bar.is-locked .lock-btn{ background:var(--sun); }
  .stage-chip{
    position:absolute; top:10px; left:10px; padding:5px 12px; border-radius:999px;
    background:var(--card); border:2px solid var(--ink); font-size:12px; font-weight:800;
    box-shadow:0 2px 0 rgba(58,52,42,0.25); z-index:5;
  }

  .results{ padding:4px 14px 14px; }
  .res-row{
    display:flex; flex-direction:column; gap:8px;
    padding:11px 0; border-bottom:1px dashed var(--card-edge);
  }
  .res-row:last-child{ border-bottom:none; }
  .res-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .res-name{ font-size:13px; font-weight:700; color:var(--ink); }
  .res-nums{ font-size:11px; color:var(--ink-soft); line-height:1.6; }
  .res-nums .diff-line{ display:block; }
  .chip{
    padding:5px 14px; border-radius:999px; font-size:12px; font-weight:800; border:2px solid var(--ink);
    white-space:nowrap; flex:0 0 auto;
  }
  .hint{ font-size:11px; color:var(--ink-soft); line-height:1.6; padding:8px 14px 2px; }

  .fab{
    margin:14px 4px 2px; width:100%; padding:13px; border-radius:16px; border:2px solid var(--ink);
    background:var(--leaf); color:#fff; font-family:'Baloo 2'; font-weight:700; font-size:15px;
    box-shadow:0 4px 0 var(--leaf-deep); cursor:pointer;
  }
  .fab:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--leaf-deep); }

  /* preset manager tab */
  .preset-add-box{
    border:2px dashed var(--card-edge); border-radius:16px; padding:12px; margin-bottom:14px; background:#FFFDF8;
  }
  .preset-add-box .field{ margin-bottom:8px; }
  .btn-solid{
    width:100%; padding:10px; border-radius:12px; border:2px solid var(--ink); font-weight:800;
    font-size:13px; cursor:pointer; background:var(--sun); box-shadow:0 3px 0 rgba(58,52,42,0.2);
  }
  .btn-solid:active{ transform:translateY(2px); box-shadow:none; }
  .preset-card{
    border:2px solid var(--card-edge); border-radius:16px; padding:11px 13px; margin-bottom:10px; background:#FFFDF8;
  }
  .preset-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
  .preset-card-name{ font-weight:800; font-size:13.5px; }
  .preset-card-cat{ font-size:11px; color:var(--ink-soft); font-weight:700; margin-top:2px; }
  .preset-card-vals{ font-size:11px; color:var(--ink-soft); line-height:1.6; margin-bottom:9px; }
  .preset-card-actions{ display:flex; gap:8px; }
  .btn-mini{
    flex:1; padding:7px 4px; border-radius:10px; border:2px solid var(--ink); font-weight:800;
    font-size:12px; cursor:pointer; text-align:center; background:var(--card);
  }
  .btn-mini.primary{ background:var(--leaf); color:#fff; }
  .btn-mini.danger{ background:#FFD9CC; }
  .empty-state{ text-align:center; padding:22px 10px; color:var(--ink-soft); font-size:12.5px; line-height:1.7; }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><div class="dot"></div><h1>穿搭鏡</h1></div>
      <div class="icon-btn" id="bodyShortcutBtn" title="我的身型" style="font-size:11px;font-weight:800;">身型</div>
    </div>

    <div class="type-select-wrap">
      <label>服裝類型</label>
      <div class="select-shell">
        <select class="type-select" id="categorySelect"></select>
      </div>
    </div>

    <div class="presets-row" id="presetsRow"></div>

    <div class="stage" id="stage">
      <div class="cloud" style="width:36px;height:16px;top:14px;left:20px;"></div>
      <div class="cloud" style="width:26px;height:12px;top:26px;left:52px;"></div>
      <div class="cloud" style="width:30px;height:14px;top:18px;right:26px;"></div>
      <div class="stage-chip" id="stageChip">目前試穿：T恤</div>
      <svg class="figure" id="figureSvg" viewBox="0 0 120 200" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="stage-rotate">
        <div class="icon-btn rotate-btn" aria-label="向左旋轉"><span class="tri tri-left"></span></div>
        <div class="icon-btn rotate-btn" aria-label="向右旋轉"><span class="tri tri-right"></span></div>
      </div>
    </div>

    <div class="verdict-banner" id="verdictBanner">
      <div class="verdict-badge" id="verdictBadge">合身</div>
      <div>
        <div class="t1">整體判定</div>
        <div class="t2" id="verdictText">請先輸入身型與衣服尺寸</div>
      </div>
    </div>

    <div class="sheet">
      <div class="tabs">
        <div class="tab active" data-tab="cloth">衣服尺寸</div>
        <div class="tab" data-tab="result">分析結果</div>
        <div class="tab" data-tab="body">我的身型</div>
        <div class="tab" data-tab="presets">常用版型</div>
      </div>

      <div class="panel" id="panel-body">
        <div class="lock-bar" id="lockBar">
          <div class="lock-label" id="lockLabel"><span class="status-dot" id="lockDot"></span>目前可編輯身型資料</div>
          <button class="lock-btn" id="lockBtn" type="button">輸入完成，鎖定</button>
        </div>
        <div class="grid2" id="bodyInputsGrid">
          <div class="field"><label>身高 (cm)</label><input type="number" inputmode="decimal" id="b_height" value="175"></div>
          <div class="field"><label>體重 (kg)<span class="opt">選填</span></label><input type="number" inputmode="decimal" id="b_weight" placeholder="選填"></div>
          <div class="field"><label>肩寬 (cm)</label><input type="number" inputmode="decimal" id="b_shoulder" value="45"></div>
          <div class="field"><label>胸圍 (cm)</label><input type="number" inputmode="decimal" id="b_chest" value="92"></div>
          <div class="field"><label>腰圍 (cm)</label><input type="number" inputmode="decimal" id="b_waist" value="80"></div>
          <div class="field"><label>臀圍 (cm)</label><input type="number" inputmode="decimal" id="b_hip" value="96"></div>
          <div class="field"><label>臂長 (cm)</label><input type="number" inputmode="decimal" id="b_arm" value="58"></div>
          <div class="field"><label>肘長 (cm)</label><input type="number" inputmode="decimal" id="b_elbow" value="33"></div>
          <div class="field"><label>頸圍 (cm)<span class="opt">選填</span></label><input type="number" inputmode="decimal" id="b_neck" placeholder="選填"></div>
          <div class="field"><label>胯下長 (cm)</label><input type="number" inputmode="decimal" id="b_inseam" value="78"></div>
          <div class="field"><label>大腿圍 (cm)</label><input type="number" inputmode="decimal" id="b_thigh" value="54"></div>
          <div class="field"><label>小腿圍 (cm)<span class="opt">選填</span></label><input type="number" inputmode="decimal" id="b_calf" placeholder="選填"></div>
        </div>
        <div class="hint">身材偏瘦／寬鬆會影響「建議衣長」的判斷，可依實際感受調整體型（下方衣服分頁會用到）。</div>
      </div>

      <div class="panel active" id="panel-cloth">
        <div class="field">
          <label>體型偏好（影響衣長建議）</label>
          <select id="c_build" class="simple-select">
            <option value="-2">緊身</option>
            <option value="0">合身</option>
            <option value="2">寬鬆</option>
            <option value="4">oversize</option>
          </select>
        </div>
        <div id="topFields">
          <div class="field">
            <label>袖型</label>
            <select id="c_sleeveType" class="simple-select">
              <option value="short">短袖</option>
              <option value="long">長袖</option>
            </select>
          </div>
          <div class="grid2">
            <div class="field"><label>衣長 (cm)</label><input type="number" inputmode="decimal" id="c_length" value="72"></div>
            <div class="field"><label>肩寬 (cm)</label><input type="number" inputmode="decimal" id="c_shoulder" value="47"></div>
            <div class="field"><label>胸圍 (cm)</label><input type="number" inputmode="decimal" id="c_chest" value="100"></div>
            <div class="field"><label>袖長 (cm)</label><input type="number" inputmode="decimal" id="c_sleeve" value="21"></div>
          </div>
        </div>
        <div id="pantFields" style="display:none;">
          <div class="grid2">
            <div class="field"><label>褲長 (cm)</label><input type="number" inputmode="decimal" id="p_length" value="100"></div>
            <div class="field"><label>腰寬 (平量,cm)</label><input type="number" inputmode="decimal" id="p_waist" value="40"></div>
            <div class="field"><label>臀圍 (cm)</label><input type="number" inputmode="decimal" id="p_hip" value="104"></div>
            <div class="field"><label>大腿圍 (cm)</label><input type="number" inputmode="decimal" id="p_thigh" value="60"></div>
            <div class="field"><label>檔深 (cm)<span class="opt">選填，判斷腰型</span></label><input type="number" inputmode="decimal" id="p_rise" placeholder="選填"></div>
          </div>
          <div class="hint">腰寬會自動 ×2 換算成腰圍再比對；檔深 24~27cm 為中低腰，28~32cm 為高腰。</div>
        </div>
      </div>

      <div class="panel" id="panel-result">
        <div class="results" id="resultsBox"></div>
        <div class="hint" id="lengthHint"></div>
        <div class="hint" id="sleeveHint"></div>
      </div>

      <div class="panel" id="panel-presets">
        <div class="preset-add-box">
          <div class="field">
            <label>版型名稱<span class="opt">例：UNIQLO 男裝內衣 M</span></label>
            <input type="text" id="presetNameInput" placeholder="輸入品牌／款式／尺碼名稱">
          </div>
          <div class="field">
            <label>穿著心得<span class="opt">尺碼對照備註</span></label>
            <select id="presetFitNoteInput" class="simple-select">
              <option value="unknown">尚未試穿</option>
              <option value="tight">太緊／偏小</option>
              <option value="good">合身／剛好</option>
              <option value="loose">偏大／寬鬆</option>
              <option value="returned">已退貨</option>
            </select>
          </div>
          <div class="hint" style="padding:0 0 8px;">會直接儲存目前「衣服尺寸」分頁裡的數值（含目前選擇的服裝類型），並記錄建立日期，方便日後當作尺碼對照的歷史紀錄。</div>
          <button class="btn-solid" id="savePresetBtn" type="button">＋ 另存為常用版型</button>
        </div>
        <div id="presetList"></div>
      </div>

      <div style="padding:0 14px;"><button class="fab" id="analyzeBtn">分析這件衣服</button></div>
    </div>
  </div>

<script>
const CATS = ["T恤","襯衫","毛衣","西裝","大學T","夾克","大衣","褲子"];
const SLEEVE_DEFAULT = { "T恤":"short","大學T":"short","襯衫":"long","毛衣":"long","西裝":"long","夾克":"long","大衣":"long" };
let activeCat = "T恤";
let presets = [];

// ---- category dropdown ----
const categorySelect = document.getElementById('categorySelect');
CATS.forEach(c=>{
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c;
  categorySelect.appendChild(opt);
});
categorySelect.value = activeCat;

function updateCategoryUI(c){
  document.getElementById('topFields').style.display = c==='褲子' ? 'none':'block';
  document.getElementById('pantFields').style.display = c==='褲子' ? 'block':'none';
  if(c !== '褲子' && SLEEVE_DEFAULT[c]){
    document.getElementById('c_sleeveType').value = SLEEVE_DEFAULT[c];
  }
  const chip = document.getElementById('stageChip');
  if(chip) chip.textContent = '目前試穿：' + c;
}
categorySelect.addEventListener('change', ()=>{
  activeCat = categorySelect.value;
  updateCategoryUI(activeCat);
  switchTab('cloth');
  render();
});
updateCategoryUI(activeCat);

// tabs
function switchTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  const tabEl = document.querySelector('.tab[data-tab="'+name+'"]');
  const panelEl = document.getElementById('panel-'+name);
  if(tabEl) tabEl.classList.add('active');
  if(panelEl) panelEl.classList.add('active');
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=> switchTab(t.dataset.tab));
});
document.getElementById('bodyShortcutBtn').addEventListener('click', ()=> switchTab('body'));

// body lock
let bodyLocked = false;
function updateLockUI(){
  const grid = document.getElementById('bodyInputsGrid');
  const bar = document.getElementById('lockBar');
  const label = document.getElementById('lockLabel');
  const btn = document.getElementById('lockBtn');
  grid.querySelectorAll('input').forEach(inp=> inp.disabled = bodyLocked);
  bar.classList.toggle('is-locked', bodyLocked);
  label.innerHTML = '<span class="status-dot" id="lockDot"></span>' + (bodyLocked ? '身型資料已鎖定，避免誤觸' : '目前可編輯身型資料');
  btn.textContent = bodyLocked ? '解鎖修改' : '輸入完成，鎖定';
}
document.getElementById('lockBtn').addEventListener('click', ()=>{
  bodyLocked = !bodyLocked;
  updateLockUI();
});
updateLockUI();

// ---- reference tables (from source charts) ----
const CHEST_TABLE = {
  "T恤":   {fit:[2,4], loose:[8,8], baggy:[12,999]},
  "襯衫":  {fit:[4,6], loose:[8,10], baggy:[14,999]},
  "毛衣":  {fit:[2,6], loose:[6,10], baggy:[12,999]},
  "西裝":  {fit:[8,8], loose:[10,12], baggy:[14,999]},
  "大學T": {fit:[10,14], loose:[18,22], baggy:[24,999]},
  "夾克":  {fit:[12,16], loose:[20,24], baggy:[28,999]},
  "大衣":  {fit:[15,20], loose:[24,26], baggy:[30,999]},
};
const SHOULDER_STEPS = {fit:[2,3], loose:[4,6], baggy:[7,12]}; // beyond 12 -> 過大
const WAIST_TABLE = {tight:[0,2], slim:[1,2], fit:[1,3], relax:[1,4], loose:[2,4]};
const HIP_TABLE   = {tight:[0,4], slim:[5,10], fit:[10,15], relax:[15,20], loose:[20,999]};
const THIGH_TABLE = {tight:[2,3], slim:[4,6], fit:[6,8], relax:[8,10], loose:[10,999]};

function classifyByThreeStage(diff, table){
  if(diff < table.fit[0]) return {label:"貼身", tone:"coral"};
  if(diff <= table.fit[1]) return {label:"合身", tone:"leaf"};
  if(diff <= table.loose[1]) return {label:"微寬鬆", tone:"sun"};
  if(diff <= table.baggy[1]) return {label:"寬鬆", tone:"sky"};
  return {label:"oversize", tone:"lav"};
}
function classifyShoulder(diff){
  if(diff < 0) return {label:"太窄／緊繃", tone:"coral"};
  if(diff <= SHOULDER_STEPS.fit[1]) return {label:"合身", tone:"leaf"};
  if(diff <= SHOULDER_STEPS.loose[1]) return {label:"微寬鬆", tone:"sun"};
  if(diff <= SHOULDER_STEPS.baggy[1]) return {label:"oversize", tone:"lav"};
  return {label:"過大", tone:"sky"};
}
function classifyPantsPart(diff, table){
  if(diff < table.tight[0]) return {label:"太緊", tone:"coral"};
  if(diff <= table.tight[1]) return {label:"緊身", tone:"coral"};
  if(diff <= table.slim[1]) return {label:"修身", tone:"sun"};
  if(diff <= table.fit[1]) return {label:"合身", tone:"leaf"};
  if(diff <= table.relax[1]) return {label:"微寬鬆", tone:"sky"};
  return {label:"寬鬆", tone:"lav"};
}
function classifyLongSleeve(diff){
  if(diff < 1) return {label:"偏短", tone:"coral"};
  if(diff <= 2) return {label:"合身", tone:"leaf"};
  if(diff <= 5) return {label:"微寬鬆", tone:"sun"};
  if(diff <= 10) return {label:"Oversize/蓋手", tone:"lav"};
  return {label:"過長", tone:"sky"};
}
function classifyShortSleeve(diff){
  if(diff < -2) return {label:"偏短", tone:"coral"};
  if(diff <= 2) return {label:"合身", tone:"leaf"};
  if(diff <= 5) return {label:"寬鬆/落肩", tone:"sky"};
  return {label:"極寬鬆", tone:"lav"};
}
function classifyRise(rise){
  if(rise < 24) return {label:"低腰", tone:"coral"};
  if(rise <= 27) return {label:"中低腰", tone:"leaf"};
  if(rise <= 32) return {label:"高腰", tone:"sky"};
  return {label:"極高腰", tone:"lav"};
}
const TONE_COLORS = {
  coral:{bg:"#FFD9CC", bd:"#E5623F", fg:"#B94722"},
  leaf: {bg:"#DCF2C6", bd:"#6FB43F", fg:"#3F7A20"},
  sun:  {bg:"#FFF0BF", bd:"#E5A924", fg:"#8A6A0A"},
  sky:  {bg:"#D3EEF9", bd:"#3E9BC7", fg:"#276E90"},
  lav:  {bg:"#E7DFF7", bd:"#9481C4", fg:"#5E4E93"},
};

function num(id, dflt){ const el = document.getElementById(id); if(!el) return dflt; const v = parseFloat(el.value); return isNaN(v)? dflt : v; }

// Pixel sprite grid — retro 8-bit block style (12 cols x 20 rows).
const SPRITE_ROWS = [
  "..HHHHHHHH..",
  ".HHHHHHHHHH.",
  ".HFFFFFFFFH.",
  ".HFFEFFEFFH.",
  ".HFFFFFFFFH.",
  "..HFFFFFFH..",
  "...FFFFFF...",
  "..OOOOOOOO..",
  ".FOOOOOOOOF.",
  ".FOOOOOOOOF.",
  ".FOOOOOOOOF.",
  ".FOOOOOOOOF.",
  "..OOOOOOOO..",
  "..PPPPPPPP..",
  "..PPPPPPPP..",
  "..PPPPPPPP..",
  "..PPPPPPPP..",
  "..PP....PP..",
  "..PP....PP..",
  ".SSS....SSS.",
];
const PIXEL = 10;

function drawFigure(overallTone){
  const svg = document.getElementById('figureSvg');
  const outfitColor = TONE_COLORS[overallTone] ? TONE_COLORS[overallTone].bd : "#6FB43F";
  const PALETTE = { H:"#4B3524", F:"#F6D3A6", E:"#2B2B26", O:outfitColor, P:"#4B5B7C", S:"#2B2B26" };
  let rects = '<rect x="14" y="192" width="92" height="6" fill="#000" opacity="0.10"/>';
  SPRITE_ROWS.forEach((row, r)=>{
    for(let c=0;c<row.length;c++){
      const code = row[c];
      if(code === '.') continue;
      rects += `<rect x="${c*PIXEL}" y="${r*PIXEL}" width="${PIXEL}" height="${PIXEL}" fill="${PALETTE[code]}"/>`;
    }
  });
  svg.innerHTML = rects;
}

function placeTags(items){
  document.querySelectorAll('.tag').forEach(t=>t.remove());
  const stage = document.getElementById('stage');
  const positions = {
    "肩寬":{top:76,left:'22%'}, "袖長":{top:118,left:'22%'}, "胸圍":{top:112,left:'78%'},
    "衣長":{top:170,left:'80%'}, "腰圍":{top:150,left:'20%'},
    "臀圍":{top:180,left:'78%'}, "大腿圍":{top:210,left:'20%'}, "褲長":{top:230,left:'80%'}
  };
  items.forEach(it=>{
    const pos = positions[it.name]; if(!pos) return;
    const c = TONE_COLORS[it.tone];
    const el = document.createElement('div');
    el.className='tag';
    el.style.top = pos.top+'px'; el.style.left = pos.left;
    el.style.background = c.bg; el.style.borderColor = c.bd; el.style.color = c.fg;
    el.textContent = it.name+' '+it.label;
    stage.appendChild(el);
  });
}

function overallFromList(items){
  const order = ["coral","leaf","sun","sky","lav"];
  const counts = {}; items.forEach(i=>counts[i.tone]=(counts[i.tone]||0)+1);
  let best = items[0] ? items[0].tone : "leaf"; let bestCount=-1;
  order.forEach(t=>{ if((counts[t]||0) > bestCount){ bestCount=counts[t]||0; best=t; }});
  return best;
}

const VERDICT_TEXT = {
  coral: {label:"偏緊", text:"整體偏緊，建議加大一號或另選版型"},
  leaf:  {label:"合身", text:"整體剛好合身，穿起來會很服貼"},
  sun:   {label:"微寬鬆", text:"整體微寬鬆，休閒好活動"},
  sky:   {label:"寬鬆", text:"整體寬鬆，秋冬疊搭剛好"},
  lav:   {label:"oversize", text:"整體 oversize，街頭感十足"},
};

function addRow(resultsBox, items, name, bodyVal, clothVal, cls, opts={}){
  const c = TONE_COLORS[cls.tone];
  const row = document.createElement('div');
  row.className='res-row';
  let numsHtml;
  if(opts.noDiff){
    numsHtml = `身型參考 ${opts.bodyLabel || ''} ・ 衣服 ${clothVal}cm`;
  } else {
    const diff = clothVal - bodyVal;
    numsHtml = `身型 ${bodyVal}cm ・ 衣服 ${clothVal}cm<span class="diff-line">差值 ${diff>0?'+':''}${diff.toFixed(1)}cm</span>`;
  }
  row.innerHTML = `<div class="res-head"><div class="res-name">${name}</div><div class="chip" style="background:${c.bg};border-color:${c.bd};color:${c.fg}">${cls.label}</div></div>
    <div class="res-nums">${numsHtml}</div>`;
  resultsBox.appendChild(row);
  if(!opts.excludeFromOverall){ items.push({name, label:cls.label, tone:cls.tone}); }
}

function render(){
  const height = num('b_height',175);
  const shoulderBody = num('b_shoulder',45);
  const chestBody = num('b_chest',92);
  const waistBody = num('b_waist',80);
  const hipBody = num('b_hip',96);
  const thighBody = num('b_thigh',54);
  const armBody = num('b_arm',58);
  const elbowBody = num('b_elbow',33);
  const buildAdj = parseFloat(document.getElementById('c_build').value)||0;

  const shortSleeveFitCenter = elbowBody*0.6;

  let items = [];
  let lengthHint = "";
  let sleeveHint = "";
  const resultsBox = document.getElementById('resultsBox');
  resultsBox.innerHTML = "";

  if(activeCat !== "褲子"){
    const clothLen = num('c_length',72);
    const clothShoulder = num('c_shoulder',47);
    const clothChest = num('c_chest',100);
    const clothSleeve = num('c_sleeve',21);
    const sleeveType = document.getElementById('c_sleeveType').value;

    const chestDiff = clothChest - chestBody;
    const chestCls = classifyByThreeStage(chestDiff, CHEST_TABLE[activeCat] || CHEST_TABLE["T恤"]);
    addRow(resultsBox, items, "胸圍", chestBody, clothChest, chestCls);

    const shoulderDiff = clothShoulder - shoulderBody;
    const shoulderCls = classifyShoulder(shoulderDiff);
    addRow(resultsBox, items, "肩寬", shoulderBody, clothShoulder, shoulderCls);

    if(sleeveType === 'short'){
      const shortDiff = clothSleeve - shortSleeveFitCenter;
      const sleeveCls = classifyShortSleeve(shortDiff);
      addRow(resultsBox, items, "袖長", Math.round(shortSleeveFitCenter*10)/10, clothSleeve, sleeveCls);
    } else {
      const sleeveDiff = clothSleeve - armBody;
      const sleeveCls = classifyLongSleeve(sleeveDiff);
      addRow(resultsBox, items, "袖長", armBody, clothSleeve, sleeveCls);
    }

    const suggestedLen = (height*0.41 + buildAdj);
    const lenDiff = clothLen - suggestedLen;
    let lenLabel, lenTone;
    if(lenDiff < -3){ lenLabel="偏短"; lenTone="coral"; }
    else if(lenDiff <= 1.5){ lenLabel="長度剛好"; lenTone="leaf"; }
    else if(lenDiff <= 5){ lenLabel="偏長"; lenTone="sky"; }
    else { lenLabel="很長／oversize款"; lenTone="lav"; }
    addRow(resultsBox, items, "衣長", Math.round(suggestedLen*10)/10, clothLen, {label:lenLabel, tone:lenTone});
    lengthHint = `建議衣長 ≈ 身高×0.41 ${buildAdj?(buildAdj>0?'+':'')+buildAdj+'cm':''} = ${suggestedLen.toFixed(1)}cm（±1cm 為最佳區間）`;
  } else {
    const pLen = num('p_length',100);
    const pWaistFlat = num('p_waist',40);
    const pHip = num('p_hip',104);
    const pThigh = num('p_thigh',60);
    const pWaistCirc = pWaistFlat*2;
    const pRiseRaw = document.getElementById('p_rise').value;

    addRow(resultsBox, items, "腰圍", waistBody, pWaistCirc, classifyPantsPart(pWaistCirc-waistBody, WAIST_TABLE));
    addRow(resultsBox, items, "臀圍", hipBody, pHip, classifyPantsPart(pHip-hipBody, HIP_TABLE));
    addRow(resultsBox, items, "大腿圍", thighBody, pThigh, classifyPantsPart(pThigh-thighBody, THIGH_TABLE));

    const nineLen = height*0.55;
    const floorLen = nineLen + 5;
    let lenLabel, lenTone;
    if(pLen < nineLen-3){ lenLabel="偏短／九分以上"; lenTone="sun"; }
    else if(pLen <= nineLen+3){ lenLabel="九分褲長"; lenTone="leaf"; }
    else if(pLen <= floorLen+2){ lenLabel="接近落地"; lenTone="sky"; }
    else { lenLabel="拖地／需改褲長"; lenTone="lav"; }
    addRow(resultsBox, items, "褲長", Math.round(nineLen*10)/10, pLen, {label:lenLabel, tone:lenTone});
    lengthHint = `參考：九分褲長 ≈ 身高×0.55 = ${nineLen.toFixed(1)}cm；落地褲長 ≈ ${floorLen.toFixed(1)}cm（此公式僅供參考，實際依個人習慣為準）`;

    if(pRiseRaw){
      const riseVal = parseFloat(pRiseRaw);
      if(!isNaN(riseVal)){
        addRow(resultsBox, items, "檔深(腰型)", null, riseVal, classifyRise(riseVal), {noDiff:true, excludeFromOverall:true, bodyLabel:"中低腰24~27・高腰28~32"});
      }
    }
    sleeveHint = "";
  }

  document.getElementById('lengthHint').textContent = lengthHint;
  document.getElementById('sleeveHint').textContent = sleeveHint;
  const overallTone = overallFromList(items);
  const v = VERDICT_TEXT[overallTone];
  const badge = document.getElementById('verdictBadge');
  const c = TONE_COLORS[overallTone];
  badge.textContent = v.label;
  badge.style.background = c.bg; badge.style.borderColor = c.bd; badge.style.color = c.fg;
  document.getElementById('verdictText').textContent = v.text;
  drawFigure(overallTone);
  placeTags(items);
}

// ---- 常用版型 (brand size presets) ----
// Uses window.storage (personal, non-shared) so presets persist across sessions
// inside the Claude artifact environment; falls back to in-memory only if unavailable.
async function loadPresets(){
  try{
    if(window.storage){
      const res = await window.storage.get('fitmirror-presets', false);
      presets = res && res.value ? JSON.parse(res.value) : [];
    }
  }catch(e){ presets = []; }
  renderPresetsRow();
  renderPresetList();
}
async function persistPresets(){
  try{
    if(window.storage){
      await window.storage.set('fitmirror-presets', JSON.stringify(presets), false);
    }
  }catch(e){ console.error('儲存常用版型失敗', e); }
}

function captureCurrentClothValues(cat){
  if(cat === '褲子'){
    return {
      p_length: num('p_length',100), p_waist: num('p_waist',40),
      p_hip: num('p_hip',104), p_thigh: num('p_thigh',60),
      p_rise: document.getElementById('p_rise').value || ''
    };
  }
  return {
    c_length: num('c_length',72), c_shoulder: num('c_shoulder',47),
    c_chest: num('c_chest',100), c_sleeve: num('c_sleeve',21),
    c_sleeveType: document.getElementById('c_sleeveType').value,
    c_build: document.getElementById('c_build').value
  };
}

const FIT_NOTE_META = {
  unknown:  {label:"尚未試穿", tone:"sun"},
  tight:    {label:"太緊／偏小", tone:"coral"},
  good:     {label:"合身／剛好", tone:"leaf"},
  loose:    {label:"偏大／寬鬆", tone:"sky"},
  returned: {label:"已退貨", tone:"lav"},
};
function formatSavedDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function presetSummary(p){
  if(p.category === '褲子'){
    let s = `褲長${p.values.p_length} ・ 腰寬${p.values.p_waist} ・ 臀圍${p.values.p_hip} ・ 大腿${p.values.p_thigh}`;
    if(p.values.p_rise) s += ` ・ 檔深${p.values.p_rise}`;
    return s;
  }
  const sleeveLabel = p.values.c_sleeveType === 'short' ? '短袖' : '長袖';
  return `衣長${p.values.c_length} ・ 肩寬${p.values.c_shoulder} ・ 胸圍${p.values.c_chest} ・ 袖長${p.values.c_sleeve}(${sleeveLabel})`;
}

function applyPreset(p){
  activeCat = p.category;
  categorySelect.value = p.category;
  updateCategoryUI(p.category);
  if(p.category === '褲子'){
    document.getElementById('p_length').value = p.values.p_length;
    document.getElementById('p_waist').value = p.values.p_waist;
    document.getElementById('p_hip').value = p.values.p_hip;
    document.getElementById('p_thigh').value = p.values.p_thigh;
    document.getElementById('p_rise').value = p.values.p_rise || '';
  } else {
    document.getElementById('c_length').value = p.values.c_length;
    document.getElementById('c_shoulder').value = p.values.c_shoulder;
    document.getElementById('c_chest').value = p.values.c_chest;
    document.getElementById('c_sleeve').value = p.values.c_sleeve;
    document.getElementById('c_sleeveType').value = p.values.c_sleeveType || 'short';
    document.getElementById('c_build').value = p.values.c_build || '0';
  }
  switchTab('result');
  render();
}

function renderPresetsRow(){
  const row = document.getElementById('presetsRow');
  row.innerHTML = '';
  presets.forEach(p=>{
    const note = FIT_NOTE_META[p.fitNote] || FIT_NOTE_META.unknown;
    const dotColor = TONE_COLORS[note.tone].bd;
    const chip = document.createElement('div');
    chip.className = 'preset-chip';
    chip.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${dotColor};display:inline-block;"></span><span>${p.name}</span>`;
    chip.title = note.label;
    chip.addEventListener('click', ()=> applyPreset(p));
    row.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'preset-chip add';
  addChip.textContent = '＋ 新增常用版型';
  addChip.addEventListener('click', ()=> switchTab('presets'));
  row.appendChild(addChip);
}

function renderPresetList(){
  const list = document.getElementById('presetList');
  list.innerHTML = '';
  if(presets.length === 0){
    list.innerHTML = '<div class="empty-state">還沒有常用版型。<br>在「衣服尺寸」分頁輸入好數值後，回來這裡命名並儲存吧！</div>';
    return;
  }
  presets.forEach(p=>{
    const note = FIT_NOTE_META[p.fitNote] || FIT_NOTE_META.unknown;
    const c = TONE_COLORS[note.tone];
    const card = document.createElement('div');
    card.className = 'preset-card';
    card.innerHTML = `
      <div class="preset-card-top">
        <div><div class="preset-card-name">${p.name}</div><div class="preset-card-cat">${p.category}${p.savedAt ? ' ・ 建立於 '+formatSavedDate(p.savedAt) : ''}</div></div>
        <div class="chip" style="background:${c.bg};border-color:${c.bd};color:${c.fg}">${note.label}</div>
      </div>
      <div class="preset-card-vals">${presetSummary(p)}</div>
      <div class="field" style="margin-bottom:9px;">
        <label>更新穿著心得</label>
        <select class="simple-select" data-act="note">
          <option value="unknown">尚未試穿</option>
          <option value="tight">太緊／偏小</option>
          <option value="good">合身／剛好</option>
          <option value="loose">偏大／寬鬆</option>
          <option value="returned">已退貨</option>
        </select>
      </div>
      <div class="preset-card-actions">
        <div class="btn-mini primary" data-act="apply">套用並分析</div>
        <div class="btn-mini danger" data-act="del">刪除</div>
      </div>`;
    card.querySelector('[data-act="note"]').value = p.fitNote || 'unknown';
    card.querySelector('[data-act="note"]').addEventListener('change', (e)=>{
      p.fitNote = e.target.value;
      persistPresets();
      renderPresetsRow();
      renderPresetList();
    });
    card.querySelector('[data-act="apply"]').addEventListener('click', ()=> applyPreset(p));
    card.querySelector('[data-act="del"]').addEventListener('click', ()=>{
      presets = presets.filter(x=>x.id !== p.id);
      persistPresets();
      renderPresetsRow();
      renderPresetList();
    });
    list.appendChild(card);
  });
}

document.getElementById('savePresetBtn').addEventListener('click', ()=>{
  const nameInput = document.getElementById('presetNameInput');
  const noteInput = document.getElementById('presetFitNoteInput');
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); return; }
  const preset = {
    id: Date.now(), name, category: activeCat,
    values: captureCurrentClothValues(activeCat),
    fitNote: noteInput.value, savedAt: Date.now()
  };
  presets.push(preset);
  persistPresets();
  nameInput.value = '';
  noteInput.value = 'unknown';
  renderPresetsRow();
  renderPresetList();
});

document.querySelectorAll('input, select').forEach(el=>el.addEventListener('input', render));
document.getElementById('analyzeBtn').addEventListener('click', ()=>{
  switchTab('result');
  render();
});

loadPresets();
render();
</script>
